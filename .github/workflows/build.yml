name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app.py"
      - "requirements.txt"
      - "icon.ico"
      - "make_icon.py"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 3 1 * *"   # monthly rebuild so the bundled packages stay current

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Retr0Downloader
            file: Retr0Downloader.exe
            icon: "--icon icon.ico"
            extra: ""
          - os: ubuntu-22.04
            name: Retr0Downloader-linux
            file: Retr0Downloader-linux
            icon: ""
            extra: "--hidden-import secretstorage --hidden-import jeepney"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk-dev

      - name: Set version
        run: printf 'VERSION = "%s"\nREPO = "%s"\n' "${{ needs.prep.outputs.version }}" "$GITHUB_REPOSITORY" > app_version.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ${{ matrix.name }}
          ${{ matrix.icon }}
          --collect-all yt_dlp
          --collect-all yt_dlp_ejs
          --collect-all curl_cffi
          --collect-all imageio_ffmpeg
          --collect-all deno
          --collect-all certifi
          ${{ matrix.extra }}
          app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.file }}

  release:
    needs: [prep, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: |
          cd out
          sha256sum Retr0Downloader* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release (this is what "Update app" downloads)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prep.outputs.version }}
          name: Retr0 Downloader ${{ needs.prep.outputs.version }}
          files: out/*
          make_latest: true
